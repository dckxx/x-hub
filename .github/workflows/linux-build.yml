name: Linux build (manual)

# 仅手动触发：本分支的 Linux 包由本地/容器构建产出并自行安装验证，不需要每次推送都
# 在 Actions 上重编一遍（也避免刷出一堆 draft prerelease）。需要云端产物时：
# Actions → 本工作流 → Run workflow，可指定要构建的 ref。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的 git ref（分支 / tag / SHA）；留空 = 触发时选中的分支'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve Linux tag
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          shortsha="$(git rev-parse --short=7 HEAD)"
          tag_name="v${version}-linux.${shortsha}"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "shortsha=${shortsha}" >> "$GITHUB_OUTPUT"
          echo "将使用标签: ${tag_name}"

      - name: Create annotated tag if missing and push
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "本地已存在标签 ${TAG_NAME}"
          else
            git tag -a "${TAG_NAME}" -m "Manual Linux build (${{ steps.tag.outputs.shortsha }})"
            echo "已创建 annotated tag ${TAG_NAME}"
          fi
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "refs/tags/${TAG_NAME}$"; then
            echo "远程已存在标签 ${TAG_NAME}，跳过 push"
          else
            git push origin "refs/tags/${TAG_NAME}"
          fi

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            patchelf \
            rpm \
            rpm-build

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release .deb and .rpm
        run: pnpm run tauri:build:linux

      - name: Locate and rename linux artifacts
        id: package
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
        run: |
          set -euo pipefail
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -1 || true)
          rpm=$(ls src-tauri/target/release/bundle/rpm/*.rpm 2>/dev/null | head -1 || true)
          if [ -z "${deb:-}" ] || [ ! -f "$deb" ]; then
            echo "未找到 .deb 产物" >&2
            find src-tauri/target/release/bundle -type f 2>/dev/null || true
            exit 1
          fi
          dest_deb="$(dirname "$deb")/${TAG_NAME}_amd64.deb"
          cp -f "$deb" "$dest_deb"
          echo "deb_name=$dest_deb" >> "$GITHUB_OUTPUT"
          echo "找到 deb: $deb → $dest_deb"
          if [ -z "${rpm:-}" ] || [ ! -f "$rpm" ]; then
            echo "未找到 .rpm 产物" >&2
            find src-tauri/target/release/bundle -type f 2>/dev/null || true
            exit 1
          fi
          dest_rpm="$(dirname "$rpm")/${TAG_NAME}.x86_64.rpm"
          cp -f "$rpm" "$dest_rpm"
          echo "rpm_name=$dest_rpm" >> "$GITHUB_OUTPUT"
          echo "找到 rpm: $rpm → $dest_rpm"

      - name: Publish prerelease (deb + rpm)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: '${{ steps.tag.outputs.tag_name }} (Linux, manual)'
          body: |
            手动触发的构建（workflow: `linux-build.yml`，`workflow_dispatch`）。

            - 版本：${{ steps.tag.outputs.version }}
            - 提交：${{ github.sha }}（${{ steps.tag.outputs.shortsha }}）
            - 触发人：@${{ github.actor }}
            - 产物：`.deb` / `.rpm`（prerelease，供 install-linux.sh 下载）

            安装：`scripts/install-linux.sh`（自动判断 deb/rpm）。
            日常验证也可走本地/容器构建（见 `LINUX.md`，注意 glibc 基座）；正式发版仍以
            `release.yml` + semver tag 为准。
          files: |
            ${{ steps.package.outputs.deb_name }}
            ${{ steps.package.outputs.rpm_name }}
          draft: false
          prerelease: true
