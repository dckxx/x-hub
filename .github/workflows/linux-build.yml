name: Linux packages

# Push to feat/linux-support or dispatch manually. Build DEB and RPM in parallel,
# then publish both packages and their SHA-256 manifest to one prerelease.
on:
  push:
    branches: [feat/linux-support]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA); empty uses the selected branch"
        required: false
        default: ""

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
      version: ${{ steps.tag.outputs.version }}
      shortsha: ${{ steps.tag.outputs.shortsha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve Linux tag
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          shortsha="$(git rev-parse --short=7 HEAD)"
          tag_name="v${version}-linux.${shortsha}"
          ref="$(git rev-parse HEAD)"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "shortsha=${shortsha}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref} tag=${tag_name}"

  linux-deb:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.meta.outputs.ref }}

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build .deb
        run: pnpm run tauri:build:deb

      - name: Stage deb artifact
        env:
          TAG_NAME: ${{ needs.meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -1)
          if [ -z "${deb:-}" ] || [ ! -f "$deb" ]; then
            echo "No .deb artifact found" >&2
            find src-tauri/target/release/bundle -type f 2>/dev/null || true
            exit 1
          fi
          mkdir -p dist-linux
          dest="dist-linux/${TAG_NAME}_amd64.deb"
          cp -f "$deb" "$dest"
          echo "staged $dest"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist-linux/*.deb
          if-no-files-found: error

  linux-rpm:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.meta.outputs.ref }}

      - name: Install RPM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            patchelf \
            rpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build .rpm
        run: pnpm run tauri:build:rpm

      - name: Stage rpm artifact
        env:
          TAG_NAME: ${{ needs.meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          rpm=$(ls src-tauri/target/release/bundle/rpm/*.rpm 2>/dev/null | head -1)
          if [ -z "${rpm:-}" ] || [ ! -f "$rpm" ]; then
            echo "No .rpm artifact found" >&2
            find src-tauri/target/release/bundle -type f 2>/dev/null || true
            exit 1
          fi
          mkdir -p dist-linux
          dest="dist-linux/${TAG_NAME}.x86_64.rpm"
          cp -f "$rpm" "$dest"
          echo "staged $dest"

      - name: Upload rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist-linux/*.rpm
          if-no-files-found: error

  publish:
    needs: [meta, linux-deb, linux-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.meta.outputs.ref }}

      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: dist-linux

      - name: Download rpm
        uses: actions/download-artifact@v4
        with:
          name: linux-rpm
          path: dist-linux

      - name: Generate and verify SHA-256 manifest
        working-directory: dist-linux
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=( *.deb *.rpm )
          if [[ ${#packages[@]} -ne 2 ]]; then
            echo "Expected one .deb and one .rpm; found ${#packages[@]} package files" >&2
            printf '%s\n' "${packages[@]}" >&2
            exit 1
          fi
          sha256sum -- "${packages[@]}" | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create annotated tag if missing and push
        env:
          TAG_NAME: ${{ needs.meta.outputs.tag_name }}
          SHORTSHA: ${{ needs.meta.outputs.shortsha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists locally"
          else
            git tag -a "${TAG_NAME}" -m "Linux packages (${SHORTSHA})"
          fi
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "refs/tags/${TAG_NAME}$"; then
            echo "Remote tag ${TAG_NAME} already exists; skipping push"
          else
            git push origin "refs/tags/${TAG_NAME}"
          fi

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag_name }}
          name: "${{ needs.meta.outputs.tag_name }} (Linux)"
          body: |
            Linux dual-runner build (workflow: `linux-build.yml`).

            - Version: ${{ needs.meta.outputs.version }}
            - Commit: ${{ needs.meta.outputs.ref }} (${{ needs.meta.outputs.shortsha }})
            - Trigger: ${{ github.event_name }} / @${{ github.actor }}
            - Artifacts: `.deb` and `.rpm`
            - Checksums: `SHA256SUMS` (SHA-256)

            Install: `scripts/install-linux.sh`
            The formal release remains `release.yml` + semver tag.
          files: |
            dist-linux/*.deb
            dist-linux/*.rpm
            dist-linux/SHA256SUMS
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
