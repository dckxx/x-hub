name: Linux build (feat/linux-support)

on:
  push:
    branches:
      - feat/linux-support
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Linux tag
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          shortsha="$(git rev-parse --short=7 HEAD)"
          tag_name="v${version}-linux.${shortsha}"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "shortsha=${shortsha}" >> "$GITHUB_OUTPUT"
          echo "将使用标签: ${tag_name}"

      - name: Create annotated tag if missing and push
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "本地已存在标签 ${TAG_NAME}"
          else
            git tag -a "${TAG_NAME}" -m "Auto Linux build from feat/linux-support (${{ steps.tag.outputs.shortsha }})"
            echo "已创建 annotated tag ${TAG_NAME}"
          fi
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "refs/tags/${TAG_NAME}$"; then
            echo "远程已存在标签 ${TAG_NAME}，跳过 push"
          else
            git push origin "refs/tags/${TAG_NAME}"
          fi

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release .deb
        run: pnpm run tauri:build:deb

      - name: Locate deb artifact
        id: package
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/x-hub_*.deb 2>/dev/null | head -1)
          if [ -z "$deb" ] || [ ! -f "$deb" ]; then
            echo "未找到 .deb 产物" >&2
            find src-tauri/target/release/bundle -type f 2>/dev/null || true
            exit 1
          fi
          echo "deb_name=$deb" >> "$GITHUB_OUTPUT"
          echo "找到: $deb"

      - name: Publish draft prerelease (.deb)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: 'x-hub ${{ steps.tag.outputs.tag_name }} (Linux auto)'
          body: |
            自动构建：推送到 `feat/linux-support` 分支触发（workflow: `linux-build.yml`）。

            - 版本：${{ steps.tag.outputs.version }}
            - 提交：${{ github.sha }}（${{ steps.tag.outputs.shortsha }}）
            - 产物：Ubuntu `.deb`（draft + prerelease）

            正式发版仍以 `release.yml` + semver tag 为准；本 release 仅供 Linux 分支验证。
          files: |
            ${{ steps.package.outputs.deb_name }}
          draft: true
          prerelease: true
