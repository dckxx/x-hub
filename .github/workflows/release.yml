name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史 + tags：release 正文优先取 RELEASE_NOTES.md 对应段落，
          # 段落缺失时回退读 tag annotation（需要 tag 对象在本地）
          fetch-depth: 0

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release .deb
        run: pnpm run tauri:build:deb

      - name: Locate deb artifact
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          deb=$(ls src-tauri/target/release/bundle/deb/x-hub_*.deb 2>/dev/null | head -1)
          if [ -z "$deb" ] || [ ! -f "$deb" ]; then
            echo "未找到 .deb 产物" >&2
            find src-tauri/target/release/bundle -type f 2>/dev/null || true
            exit 1
          fi
          echo "deb_name=$deb" >> "$GITHUB_OUTPUT"
          echo "找到: $deb"

      - name: Extract release notes from RELEASE_NOTES.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # GitHub Release 正文 = RELEASE_NOTES.md 的「# vX.Y.Z 发布说明」章节
          awk -v ver="$version" '
            BEGIN { capturing=0 }
            $0 ~ "^# v"ver"($| )" { capturing=1 }
            capturing && NR>1 && /^# / { exit }
            capturing { print }
          ' RELEASE_NOTES.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "RELEASE_NOTES.md 未找到 v${version} 段落，回退为 tag annotation" >&2
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release_notes.md
          fi

      - name: Upload linux .deb
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'x-hub ${{ github.ref_name }}'
          body_path: release_notes.md
          files: |
            ${{ steps.package.outputs.deb_name }}
          draft: true
          prerelease: false
