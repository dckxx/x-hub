name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release binary
        run: npm run tauri:build -- --no-bundle

      - name: Package portable zip
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/x-hub.exe'
          if (-not (Test-Path $exe)) { Write-Error "未找到 $exe" }
          Compress-Archive -Path $exe -DestinationPath 'x-hub-x86_64-pc-windows-portable.zip' -Force

      - name: Upload portable zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          release_name: 'x-hub ${{ github.ref_name }}'
          body: |
            便携版：解压后双击 `x-hub.exe` 即可运行。
            需要系统已安装 WebView2 运行时（Windows 10/11 一般自带）。
          files: x-hub-x86_64-pc-windows-portable.zip
          draft: true
          prerelease: false
