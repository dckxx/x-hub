name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取全部历史与 tags：release notes 取自 tag annotation（%(contents)），
          # 浅克隆不拉 tags 会导致读不到 annotation、正文回退成 commit message
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release binary
        run: npm run tauri:build -- --no-bundle

      - name: Package win-x64 zip
        id: package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $exe = 'src-tauri/target/release/x-hub.exe'
          if (-not (Test-Path $exe)) { Write-Error "未找到 $exe" }
          $zip = "x-hub-$version-win-x64.zip"
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          Write-Output "zip_name=$zip" >> $env:GITHUB_OUTPUT

      - name: Get tag annotation
        id: tag_note
        shell: pwsh
        run: |
          $note = git tag -l --format='%(contents)' $env:GITHUB_REF_NAME
          $note | Out-File -FilePath tag_note.md -Encoding utf8
          Write-Output "done"

      - name: Upload win-x64 zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          release_name: 'x-hub ${{ github.ref_name }}'
          body_path: tag_note.md
          files: ${{ steps.package.outputs.zip_name }}
          draft: true
          prerelease: false
