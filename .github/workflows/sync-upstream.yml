name: Sync upstream

# 定时任务只读默认分支上的 workflow。本文件是 master 上唯一允许与上游不同源的覆盖；
# Linux 实现永远只留在 feat/linux-support。
#
# 1) origin/master ← 快进 upstream/master，再把本文件填回去
# 2) 把 upstream/master merge 进 feat/linux-support；成功即新基线
# 3) 有冲突：abort，不 force-push，开 issue，Linux 停在上一个可用基线
#
# 不 rebase、不 force-push feat/linux-support，避免 linux-build.yml 打出的 tag 指针漂移。
on:
  schedule:
    # 09:17 HKT，错开整点
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      sync_master:
        description: '快进 origin/master 到 upstream/master（保留本 workflow）'
        type: boolean
        default: true
      merge_linux:
        description: '尝试把 upstream/master 合入 feat/linux-support'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM: https://github.com/dckxx/x-hub.git
      LINUX_BRANCH: feat/linux-support
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep a copy of this workflow
        run: |
          set -euo pipefail
          mkdir -p /tmp/xhub-sync
          cp -f .github/workflows/sync-upstream.yml /tmp/xhub-sync/sync-upstream.yml

      - name: Fetch origin and upstream
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          git fetch --prune origin
          git fetch --prune upstream master
          git rev-parse --short upstream/master
          git rev-parse --short origin/master

      - name: Fast-forward master to upstream
        if: ${{ github.event_name == 'schedule' || inputs.sync_master }}
        run: |
          set -euo pipefail
          git checkout -B master origin/master
          if git merge-base --is-ancestor upstream/master master; then
            echo "origin/master 已包含 upstream/master，不需快进"
          else
            if git merge --ff-only upstream/master; then
              echo "master 已快进到 $(git rev-parse --short master)"
            else
              echo "master 无法快进（有本地独有提交，多半就是本 workflow），改用 reset + 填回 workflow"
              git reset --hard upstream/master
            fi
          fi

          mkdir -p .github/workflows
          cp -f /tmp/xhub-sync/sync-upstream.yml .github/workflows/sync-upstream.yml
          if [ -n "$(git status --porcelain .github/workflows/sync-upstream.yml)" ]; then
            git add .github/workflows/sync-upstream.yml
            git commit -m "ci(sync): 保留上游同步 workflow（master 不含 Linux）"
          fi

          git push origin master
          echo "pushed master=$(git rev-parse --short master)"

      - name: Merge upstream into Linux baseline
        id: linux
        if: ${{ github.event_name == 'schedule' || inputs.merge_linux }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify "origin/${LINUX_BRANCH}" >/dev/null 2>&1; then
            echo "缺少 origin/${LINUX_BRANCH}，跳过"
            echo "status=missing-branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B "$LINUX_BRANCH" "origin/${LINUX_BRANCH}"
          linux_before="$(git rev-parse HEAD)"
          echo "linux_before=${linux_before}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "${LINUX_BRANCH} 已包含 upstream/master，无需合并"
            echo "status=already-current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "冲突文件列表将写入 /tmp/xhub-sync/conflicts.txt"
          if git merge --no-edit upstream/master; then
            git push origin "$LINUX_BRANCH"
            echo "status=merged" >> "$GITHUB_OUTPUT"
            echo "linux_after=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "已合并并推送 ${LINUX_BRANCH}=$(git rev-parse --short HEAD)"
            exit 0
          fi

          git diff --name-only --diff-filter=U > /tmp/xhub-sync/conflicts.txt || true
          echo "status=conflict" >> "$GITHUB_OUTPUT"
          echo "conflict_count=$(wc -l < /tmp/xhub-sync/conflicts.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          git merge --abort
          echo "合并冲突，已 abort。${LINUX_BRANCH} 仍停在 ${linux_before}"

      - name: Open or refresh conflict issue
        if: ${{ steps.linux.outputs.status == 'conflict' }}
        env:
          LINUX_BEFORE: ${{ steps.linux.outputs.linux_before }}
          CONFLICT_COUNT: ${{ steps.linux.outputs.conflict_count }}
        run: |
          set -euo pipefail
          body_file=$(mktemp)
          {
            echo "## Linux 基线无法自动合入上游 master"
            echo
            echo "- 上游：\`dckxx/x-hub\` \`$(git rev-parse --short upstream/master)\`"
            echo "- Linux 基线仍停：\`${LINUX_BRANCH}\` \`${LINUX_BEFORE:0:7}\`"
            echo "- master **没有** 合入 Linux代码（主仓库暂时放弃 Linux 支持）"
            echo "- 冲突文件数：${CONFLICT_COUNT}"
            echo
            echo '```'
            cat /tmp/xhub-sync/conflicts.txt
            echo '```'
            echo
            echo "手动处理："
            echo
            echo '```bash'
            echo "git fetch upstream master"
            echo "git checkout ${LINUX_BRANCH}"
            echo "git merge upstream/master"
            echo "# 解决冲突后"
            echo "git push origin ${LINUX_BRANCH}"
            echo '```'
            echo
            echo "来源：workflow \`sync-upstream.yml\` / run ${{ github.run_id }}"
          } > "$body_file"

          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "Linux 基线无法自动合入 in:title" --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body-file "$body_file"
            echo "updated issue #${existing}"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Linux 基线无法自动合入上游 master" \
              --body-file "$body_file"
          fi
