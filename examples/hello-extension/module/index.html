<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: transparent;
      color: #e8e9f0;
      padding: 12px;
      box-sizing: border-box;
    }
    .stat { text-align: center; }
    .stat b { font-size: 26px; color: #8b8bff; display: block; line-height: 1.1; }
    .stat span { font-size: 12px; color: #8a8ba8; }
  </style>
</head>
<body>
  <div class="stat">
    <b id="num">…</b>
    <span id="label">加载中</span>
  </div>
  <script>
    ;(async () => {
      try {
        const [notes, usage] = await Promise.all([
          window.xhub.data.notes.list(),
          window.xhub.data.usage.summary(),
        ])
        document.getElementById('num').textContent = notes.length
        document.getElementById('label').textContent =
          '条笔记 · 今日 ' + usage.today_count + ' 次 AI 调用'
      } catch (e) {
        document.getElementById('num').textContent = '!'
        document.getElementById('label').textContent = e.code ? e.code + ': ' + e.message : e.message
      }
    })()
  </script>
</body>
</html>
