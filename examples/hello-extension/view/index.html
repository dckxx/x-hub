<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Hello 扩展</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #12131b;
      color: #e8e9f0;
      font-size: 14px;
      line-height: 1.6;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: #8a8ba8; font-size: 13px; margin: 0 0 20px; }
    h2 { font-size: 13px; color: #8b8bff; margin: 20px 0 8px; }
    pre {
      background: #1c1d2a;
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
      font-size: 12px;
      margin: 0;
      max-height: 240px;
    }
    code { background: #1c1d2a; padding: 1px 6px; border-radius: 4px; }
    .err { color: #ff6b6b; }
  </style>
</head>
<body>
  <h1>Hello 扩展</h1>
  <p class="sub">这个页面跑在 x-hub 主区的 iframe 里，通过 <code>window.xhub</code> 读取宿主数据。</p>

  <h2>runtime.info()</h2>
  <pre id="info">加载中…</pre>

  <h2>data.notes.list()（需 data:read 权限）</h2>
  <pre id="notes">加载中…</pre>

  <h2>data.todos.list()（需 data:read 权限）</h2>
  <pre id="todos">加载中…</pre>

  <h2>data.usage.summary()（需 data:read 权限）</h2>
  <pre id="usage">加载中…</pre>

  <h2>storage 读写（无需权限，随扩展隔离持久化）</h2>
  <pre id="storage">加载中…</pre>

  <script>
    function render(id, promise) {
      promise
        .then((v) => {
          document.getElementById(id).textContent = JSON.stringify(v, null, 2)
        })
        .catch((e) => {
          document.getElementById(id).textContent = '错误 ' + (e.code || '') + ': ' + e.message
          document.getElementById(id).classList.add('err')
        })
    }

    render('info', window.xhub.runtime.info())
    render('notes', window.xhub.data.notes.list())
    render('todos', window.xhub.data.todos.list())
    render('usage', window.xhub.data.usage.summary())

    ;(async () => {
      try {
        const prev = (await window.xhub.storage.get('visits')) || 0
        await window.xhub.storage.set('visits', prev + 1)
        const v = await window.xhub.storage.get('visits')
        document.getElementById('storage').textContent = '第 ' + v + ' 次打开（storage 持久化于扩展目录 .storage.json）'
      } catch (e) {
        document.getElementById('storage').textContent = '错误 ' + (e.code || '') + ': ' + e.message
        document.getElementById('storage').classList.add('err')
      }
    })()
  </script>
</body>
</html>
