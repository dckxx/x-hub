# x-hub 自建分发站 Nginx 配置模板（由 init-server.sh 用 sed 替换 __PORT__ / __ROOT__ 占位符）
# 缓存策略：清单可回源（no-cache），包体/图标/版本副本不可变（一年 immutable）
# Range（断点续传）：静态文件原生支持 206，勿在本 server 块套 proxy_pass

server {
    listen __PORT__;
    server_name _;

    root __ROOT__;
    default_type application/octet-stream;

    # —— 清单类：禁止缓存（客户端有签名校验，只求每次回源拿最新）——
    location = /extensions/registry.json      { add_header Cache-Control "no-cache"; }
    location = /extensions/registry.json.sig  { add_header Cache-Control "no-cache"; }
    location = /releases/update.json          { add_header Cache-Control "no-cache"; }
    location = /releases/update.json.sig      { add_header Cache-Control "no-cache"; }

    # —— 不可变包体：路径含版本号，一年缓存 ——
    location ~* \.(xhpack|zip|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # 带版本号的清单副本（releases/packages/update-<ver>.json）同为不可变
    location ^~ /releases/packages/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
